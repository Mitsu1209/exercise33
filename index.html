<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 空間認知リアクション</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation;
        }
        .numpad-container {
            position: relative;
            max-width: 400px;
            margin: 0 auto;
        }
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        .cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 1rem;
            background-color: white;
            color: #374151;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease-in-out;
            border: 4px solid #e5e7eb;
        }
        /* セルの状態色 */
        .cell.active-red {
            background-color: #ef4444; 
            color: white;
            border-color: #b91c1c;
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.4);
        }
        .cell.active-blue {
            background-color: #3b82f6; 
            color: white;
            border-color: #1d4ed8;
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }
        .cell.success {
            background-color: #22c55e; 
            color: white;
            border-color: #15803d;
        }
        .cell.fail {
            background-color: #4b5563; 
            color: white;
            border-color: #1f2937;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- BGM -->
    <audio id="bgm" src="かけっこ競争.mp3" loop></audio>

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden p-8 text-center">
        
        <!-- ステータスバー -->
        <div id="status-bar" class="hidden flex justify-between items-center mb-8 px-4 py-3 bg-gray-100 rounded-xl">
            <div class="text-2xl font-bold text-gray-700">現在: <span id="score-display" class="text-blue-600 text-3xl">0</span> 点</div>
            <div class="text-2xl font-bold text-gray-700">残り時間: <span id="time-display" class="text-red-500 text-3xl">60</span> 秒</div>
        </div>

        <!-- スタート画面 -->
        <div id="start-screen" class="space-y-6">
            <h1 class="text-4xl font-extrabold text-gray-800 tracking-tight">3x3 脳トレリアクション</h1>
            <div class="text-left bg-blue-50 p-6 rounded-xl border border-blue-100 text-lg text-gray-700 leading-relaxed space-y-3">
                <p><strong>【ルール説明】</strong> テンキー（1〜9）を使います。3つのパターンが出現します。</p>
                <ul class="list-disc list-inside ml-2 space-y-2">
                    <li><span class="text-red-500 font-bold">赤く光ったら</span>：光った数字を押す。</li>
                    <li><span class="text-blue-500 font-bold">青く光ったら</span>：<strong>絶対に押さない。</strong></li>
                    <li><span class="text-purple-600 font-bold">計算式が出たら</span>：答えの数字を押す。</li>
                </ul>
                <p class="text-sm text-gray-600 mt-2">制限時間60秒（全25回）。1問4点で100点満点です！</p>
            </div>
            <button id="btn-start" class="mt-4 w-full py-5 bg-blue-600 hover:bg-blue-700 text-white text-3xl font-bold rounded-2xl shadow-lg transition transform hover:scale-105">
                スタート
            </button>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="hidden">
            <div class="numpad-container">
                <!-- 計算式表示用のオーバーレイ（デフォルト非表示） -->
                <div id="math-container" class="hidden absolute inset-0 flex items-center justify-center bg-white border-4 border-gray-200 z-10 rounded-xl shadow-lg transition-colors duration-200">
                    <span id="math-expression" class="text-8xl font-black text-gray-800 tracking-widest"></span>
                </div>

                <!-- テンキーレイアウト: 789, 456, 123 -->
                <div class="numpad-grid">
                    <div class="cell" id="cell-7">7</div>
                    <div class="cell" id="cell-8">8</div>
                    <div class="cell" id="cell-9">9</div>
                    
                    <div class="cell" id="cell-4">4</div>
                    <div class="cell" id="cell-5">5</div>
                    <div class="cell" id="cell-6">6</div>
                    
                    <div class="cell" id="cell-1">1</div>
                    <div class="cell" id="cell-2">2</div>
                    <div class="cell" id="cell-3">3</div>
                </div>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="hidden space-y-8">
            <h2 class="text-5xl font-extrabold text-gray-800">ゲーム終了！</h2>
            <div class="bg-gray-100 p-8 rounded-2xl">
                <p class="text-2xl text-gray-600 mb-2">あなたの得点</p>
                <p class="text-7xl font-black text-blue-600"><span id="final-score">0</span> <span class="text-4xl text-gray-500">/ 100点</span></p>
            </div>
            <p id="result-message" class="text-2xl font-bold text-gray-700"></p>
            <button id="btn-restart" class="w-full py-5 bg-green-500 hover:bg-green-600 text-white text-3xl font-bold rounded-2xl shadow-lg transition transform hover:scale-105">
                もう一度プレイ
            </button>
        </div>

    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const statusBar = document.getElementById('status-bar');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');
        const btnStart = document.getElementById('btn-start');
        const btnRestart = document.getElementById('btn-restart');
        const bgm = document.getElementById('bgm');
        
        // 新規追加：計算問題用の要素
        const mathContainer = document.getElementById('math-container');
        const mathExpression = document.getElementById('math-expression');

        let isPlaying = false;
        let score = 0;
        let timeLeft = 60;
        let currentRound = 0;
        const totalRounds = 25; 
        
        let activeCellNum = null;
        let patternType = null; // 'red', 'blue', 'math'
        let mathAnswer = null; // 計算問題の答え
        let hasRespondedThisRound = false;
        
        let clockInterval;
        let roundPhase1Timeout; 
        let roundPhase2Timeout; 

        function startGame() {
            isPlaying = true;
            score = 0;
            timeLeft = 60;
            currentRound = 0;
            updateStatusUI();
            
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            statusBar.classList.remove('hidden');
            gameScreen.classList.remove('hidden');
            
            bgm.currentTime = 0;
            bgm.play().catch(e => console.log("Audio error:", e));

            clockInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) clearInterval(clockInterval);
            }, 1000);

            runNextRound();
        }

        function endGame() {
            isPlaying = false;
            clearInterval(clockInterval);
            clearTimeout(roundPhase1Timeout);
            clearTimeout(roundPhase2Timeout);
            resetAllCells();
            resetMathContainer();
            bgm.pause();

            gameScreen.classList.add('hidden');
            statusBar.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            finalScoreDisplay.textContent = score;
            
            if (score === 100) {
                resultMessage.textContent = "完璧です！驚異的な脳の若さ！";
                resultMessage.className = "text-2xl font-bold text-red-500";
            } else if (score >= 80) {
                resultMessage.textContent = "素晴らしい！高い集中力です。";
                resultMessage.className = "text-2xl font-bold text-orange-500";
            } else {
                resultMessage.textContent = "脳がしっかり活性化しています！";
                resultMessage.className = "text-2xl font-bold text-blue-500";
            }
        }

        function generateMathProblem() {
            // 答えが必ず 1〜9 になるようにする
            mathAnswer = Math.floor(Math.random() * 9) + 1; 
            
            let opChoices = [];
            if (mathAnswer >= 2) opChoices.push('+'); // 足し算可能
            if (mathAnswer <= 8) opChoices.push('-'); // 引き算可能
            if (opChoices.length === 0) opChoices = ['+']; 
            
            const operator = opChoices[Math.floor(Math.random() * opChoices.length)];
            let a, b;
            
            if (operator === '+') {
                // a + b = answer (例: 答えが5なら、aは1〜4)
                a = Math.floor(Math.random() * (mathAnswer - 1)) + 1;
                b = mathAnswer - a;
                mathExpression.textContent = `${a} ＋ ${b}`;
            } else {
                // a - b = answer (例: 答えが5なら、aは6〜9)
                a = Math.floor(Math.random() * (9 - mathAnswer)) + mathAnswer + 1;
                b = a - mathAnswer;
                mathExpression.textContent = `${a} － ${b}`;
            }
        }

        function runNextRound() {
            if (currentRound >= totalRounds) {
                endGame();
                return;
            }
            
            currentRound++;
            hasRespondedThisRound = false;
            resetAllCells();
            resetMathContainer();

            // ランダムでパターンを決定（赤:40%, 計算:40%, 青:20%）
            const rand = Math.random();
            if (rand < 0.4) {
                patternType = 'math';
            } else if (rand < 0.8) {
                patternType = 'red';
            } else {
                patternType = 'blue';
            }
            
            if (patternType === 'math') {
                // 計算問題を表示（テンキーの上に大きく覆いかぶせる）
                generateMathProblem();
                mathContainer.classList.remove('hidden');
            } else {
                // 赤または青の色を点灯
                activeCellNum = Math.floor(Math.random() * 9) + 1;
                const cellElement = document.getElementById(`cell-${activeCellNum}`);
                cellElement.classList.add(`active-${patternType}`);
            }

            // 2.0秒間待機
            roundPhase1Timeout = setTimeout(() => {
                evaluateMissedResponse();
                // 0.4秒間結果を表示して次へ
                roundPhase2Timeout = setTimeout(() => {
                    runNextRound();
                }, 400); 
            }, 2000);
        }

        function evaluateMissedResponse() {
            // 時間切れの場合の処理
            if (!hasRespondedThisRound) {
                hasRespondedThisRound = true; 
                
                if (patternType === 'blue') {
                    // 青は押さなくて正解
                    addScore(4); 
                    const cell = document.getElementById(`cell-${activeCellNum}`);
                    cell.classList.remove('active-blue');
                    cell.classList.add('success');
                } else if (patternType === 'red') {
                    // 赤は時間切れでミス
                    const cell = document.getElementById(`cell-${activeCellNum}`);
                    cell.classList.remove('active-red');
                    cell.classList.add('fail');
                } else if (patternType === 'math') {
                    // 計算も時間切れでミス
                    setMathContainerState('fail');
                }
            }
        }

        function handleInput(pressedNumber) {
            if (!isPlaying || hasRespondedThisRound || patternType === null) return;
            
            hasRespondedThisRound = true; 

            if (patternType === 'red') {
                const cell = document.getElementById(`cell-${activeCellNum}`);
                if (pressedNumber === activeCellNum) {
                    addScore(4);
                    cell.classList.remove('active-red');
                    cell.classList.add('success');
                } else {
                    cell.classList.remove('active-red');
                    cell.classList.add('fail');
                    flashWrongCell(pressedNumber);
                }
            } else if (patternType === 'blue') {
                // 青の時に押してしまったらミス
                const cell = document.getElementById(`cell-${activeCellNum}`);
                cell.classList.remove('active-blue');
                cell.classList.add('fail');
            } else if (patternType === 'math') {
                // 計算の答え合わせ
                if (pressedNumber === mathAnswer) {
                    addScore(4);
                    setMathContainerState('success');
                } else {
                    setMathContainerState('fail');
                }
            }
        }

        function flashWrongCell(num) {
            const wrongCell = document.getElementById(`cell-${num}`);
            if (wrongCell) {
                wrongCell.classList.add('fail');
                setTimeout(() => wrongCell.classList.remove('fail'), 300);
            }
        }

        // 計算問題表示コンテナの正誤アニメーション
        function setMathContainerState(state) {
            mathContainer.classList.remove('bg-white', 'border-gray-200');
            mathExpression.classList.remove('text-gray-800');
            mathExpression.classList.add('text-white');
            
            if (state === 'success') {
                mathContainer.classList.add('bg-green-500', 'border-green-700');
            } else {
                mathContainer.classList.add('bg-gray-600', 'border-gray-800');
            }
        }

        function resetMathContainer() {
            mathContainer.classList.add('hidden');
            mathContainer.classList.remove('bg-green-500', 'border-green-700', 'bg-gray-600', 'border-gray-800');
            mathContainer.classList.add('bg-white', 'border-gray-200');
            mathExpression.classList.remove('text-white');
            mathExpression.classList.add('text-gray-800');
        }

        function resetAllCells() {
            for (let i = 1; i <= 9; i++) {
                document.getElementById(`cell-${i}`).className = 'cell';
            }
        }

        function addScore(points) {
            score += points;
            scoreDisplay.textContent = score;
            scoreDisplay.classList.add('scale-150', 'transition', 'transform');
            setTimeout(() => scoreDisplay.classList.remove('scale-150'), 150);
        }

        function updateStatusUI() {
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
        }

        window.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '9') {
                handleInput(parseInt(e.key, 10));
            }
        });

        btnStart.addEventListener('click', startGame);
        btnRestart.addEventListener('click', startGame);

    </script>
</body>
</html>
